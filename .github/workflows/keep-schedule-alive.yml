name: Keep scheduled workflows active

on:
  schedule:
    # 공개 저장소의 예약 workflow가 60일 무활동으로 중지되지 않도록 매월 갱신
    - cron: "23 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Record repository activity
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .schedule-keepalive
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .schedule-keepalive
          git commit -m 'chore: keep scheduled workflows active'
          git push
